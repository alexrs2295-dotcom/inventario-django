{% extends 'base.html' %}
{% block content %}
<div class="page-head">
  <h1>Proveedores</h1>
  <a class="btn btn-primary" data-modal href="{% url 'supplier_create' %}">Nuevo proveedor</a>
</div>
<div class="card tabla-wrap"><div class="table-responsive">
<table class="table align-middle tabla-cards">
  <thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th><span class="visually-hidden">Acciones</span></th></tr></thead>
  <tbody>
  {% for s in object_list %}
  <tr>
    <td data-label="Nombre">{{ s.nombre }}</td>
    <td data-label="Email">{{ s.email }}</td>
    <td data-label="Teléfono">{{ s.telefono }}</td>
    <td class="actions">
      <a class="btn btn-sm btn-outline-secondary" data-modal href="{% url 'supplier_update' s.pk %}">Editar</a>
      <a class="btn btn-sm btn-outline-danger" data-modal href="{% url 'supplier_delete' s.pk %}">Eliminar</a>
    </td>
  </tr>
  {% empty %}<tr><td colspan="4" class="vacio">Sin proveedores.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div></div>
{% endblock %}
