{% extends 'base.html' %}
{% block content %}
<div class="page-head">
  <h1>Categorías</h1>
  <a class="btn btn-primary" data-modal href="{% url 'category_create' %}">Nueva categoría</a>
</div>
<div class="card tabla-wrap"><div class="table-responsive">
<table class="table align-middle tabla-cards">
  <thead><tr><th>Nombre</th><th><span class="visually-hidden">Acciones</span></th></tr></thead>
  <tbody>
  {% for c in object_list %}
  <tr>
    <td data-label="Nombre">{{ c.nombre }}</td>
    <td class="actions">
      <a class="btn btn-sm btn-outline-secondary" data-modal href="{% url 'category_update' c.pk %}">Editar</a>
      <a class="btn btn-sm btn-outline-danger" data-modal href="{% url 'category_delete' c.pk %}">Eliminar</a>
    </td>
  </tr>
  {% empty %}<tr><td colspan="2" class="vacio">Sin categorías.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div></div>
{% endblock %}
