{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center mt-md-4">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card card-login"><div class="card-body p-3 p-md-4">
      <h1 class="mb-4">Iniciar sesión</h1>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
        <div class="mb-3"><label class="form-label" for="id_username">Usuario</label>
          <input class="form-control" type="text" name="username" id="id_username" autofocus required></div>
        <div class="mb-3"><label class="form-label" for="id_password">Contraseña</label>
          <input class="form-control" type="password" name="password" id="id_password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
